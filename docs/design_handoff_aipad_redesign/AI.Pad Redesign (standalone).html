<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI.Pad — Redesign · standalone preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── tokens.css ─────────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════════════════
   AI.Pad — design tokens
   Paste-ready CSS custom properties. Drop into your renderer's root
   stylesheet (or :root in a global.css) and reference via var(--token).
   ─── Status colors are hex-derived from oklch() in the prototype.
       If your toolchain doesn't support oklch, the comment next to each
       value is the rough sRGB hex equivalent.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* ── Type ─────────────────────────────────────────────────────────── */
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ── Surfaces (cool near-black, subtle blue tint) ─────────────────── */
  --bg-0:       oklch(0.155 0.008 250);            /* #1c1f25  — terminal pane */
  --bg-1:       oklch(0.195 0.008 250);            /* #24272d  — chrome (titlebar, tabs, sidebar) */
  --bg-2:       oklch(0.235 0.008 250);            /* #2a2e35  — modal background */
  --bg-3:       oklch(0.275 0.009 250);            /* #313640  — active row, hover */
  --bg-4:       oklch(0.325 0.010 250);            /* #3a404a  — scrollbar thumb, soft chip */
  --bg-overlay: oklch(0.10 0.008 250 / 0.7);       /* modal scrim */

  /* ── Text ─────────────────────────────────────────────────────────── */
  --text-1: oklch(0.97 0.003 250);                 /* #f4f5f7  — primary */
  --text-2: oklch(0.74 0.006 250);                 /* #b1b4ba  — secondary */
  --text-3: oklch(0.56 0.008 250);                 /* #80848d  — tertiary */
  --text-4: oklch(0.42 0.008 250);                 /* #5a5e66  — muted */

  /* ── Borders ──────────────────────────────────────────────────────── */
  --border-1: oklch(0.30 0.010 250 / 0.6);
  --border-2: oklch(0.36 0.012 250 / 0.5);

  /* ── Accent (brand / selected / focus) ────────────────────────────── */
  --accent:      #7CA8E0;                          /* dusty blue */
  --accent-soft: #7CA8E02e;                        /* 18% alpha for focus rings */
  --accent-glow: #7CA8E059;                        /* 35% alpha for soft glows */

  /* ── Session status palette ───────────────────────────────────────── */
  --st-running:     oklch(0.78 0.15 155);          /* #82c69b  — sage green */
  --st-running-bg:  oklch(0.78 0.15 155 / 0.14);
  --st-running-ring:oklch(0.78 0.15 155 / 0.45);

  --st-awaiting:    oklch(0.82 0.13 88);           /* #d8c376  — warm amber */
  --st-awaiting-bg: oklch(0.82 0.13 88 / 0.16);
  --st-awaiting-ring:oklch(0.82 0.13 88 / 0.50);

  --st-limited:     oklch(0.70 0.18 25);           /* #d27566  — soft red */
  --st-limited-bg:  oklch(0.70 0.18 25 / 0.16);
  --st-limited-ring:oklch(0.70 0.18 25 / 0.45);

  --st-idle:        oklch(0.55 0.008 250);         /* #7f8389  — neutral */
  --st-idle-bg:     oklch(0.55 0.008 250 / 0.14);
  --st-idle-ring:   oklch(0.55 0.008 250 / 0.30);

  /* ── Terminal ANSI palette ────────────────────────────────────────── */
  --term-bg:      oklch(0.165 0.008 250);
  --term-fg:      oklch(0.92 0.004 250);
  --term-dim:     oklch(0.62 0.006 250);
  --term-green:   oklch(0.82 0.16 145);
  --term-cyan:    oklch(0.80 0.12 200);
  --term-yellow:  oklch(0.86 0.14 92);
  --term-blue:    oklch(0.78 0.13 240);
  --term-magenta: oklch(0.74 0.14 320);
  --term-red:     oklch(0.72 0.16 25);

  /* ── Layout constants ─────────────────────────────────────────────── */
  --titlebar-h:  32px;
  --tabbar-h:    36px;
  --sidebar-w:  260px;
}

/* ── Blinking cursor animation (terminal + palette caret) ─────────────── */
@keyframes aip-blink {
  0%, 49%  { opacity: 1; }
  50%,100% { opacity: 0; }
}
.aip-cursor { animation: aip-blink 1.05s steps(1) infinite; }

/* ── Awaiting-state soft pulse (optional polish) ──────────────────────── */
@keyframes aip-pulse {
  0%, 100% { transform: scale(1);    opacity: 1;   }
  50%      { transform: scale(1.08); opacity: 0.6; }
}
.aip-pulse { animation: aip-pulse 1.4s ease-in-out infinite; }

/* ── Drag regions (Electron only) ─────────────────────────────────────── */
.aip-titlebar       { -webkit-app-region: drag; }
.aip-titlebar button,
.aip-titlebar .menu-item,
.aip-no-drag        { -webkit-app-region: no-drag; }

/* ─── components.css ─────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════════════════
   AI.Pad — component styles (vanilla)
   Companion to tokens.css. All structural styling lives here so the TS
   stays focused on DOM building + dynamic per-element values.
   ═══════════════════════════════════════════════════════════════════ */

/* Reset only what we need */
.aip *, .aip *::before, .aip *::after { box-sizing: border-box; }

.aip {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-1);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
}

/* ── Shell ─────────────────────────────────────────────────────────── */
.aip-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: var(--bg-0);
  border: 1px solid var(--border-1);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.aip-shell__body {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ── Titlebar ─────────────────────────────────────────────────────── */
.aip-titlebar {
  height: var(--titlebar-h);
  background: var(--bg-1);
  border-bottom: 1px solid var(--border-1);
  display: flex;
  align-items: stretch;
  user-select: none;
  flex-shrink: 0;
}
.aip-titlebar__brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; }
.aip-titlebar__menus { display: flex; align-items: center; gap: 2px; }
.aip-titlebar__menu  { padding: 0 8px; height: 100%; display: flex; align-items: center;
                        font-size: 12.5px; color: var(--text-2); cursor: default; }
.aip-titlebar__menu:hover { background: var(--bg-3); color: var(--text-1); }
.aip-titlebar__title {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-3); letter-spacing: 0.2px;
}
.aip-titlebar__title-main { color: var(--text-2); font-weight: 500; }
.aip-titlebar__title-sub  { color: var(--text-4); margin-left: 10px; }

/* Window controls — right side */
.aip-window-controls { display: flex; height: var(--titlebar-h); }
.aip-window-control  {
  width: 46px; height: var(--titlebar-h);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-2); cursor: pointer;
}
.aip-window-control:hover { background: var(--bg-3); color: var(--text-1); }
.aip-window-control--close:hover { background: oklch(0.55 0.18 25); color: #fff; }

/* ── Tab bar ─────────────────────────────────────────────────────── */
.aip-tabbar {
  height: var(--tabbar-h);
  background: var(--bg-1);
  border-bottom: 1px solid var(--border-1);
  display: flex; align-items: stretch;
  flex-shrink: 0;
}
.aip-tab {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  height: var(--tabbar-h);
  min-width: 160px; max-width: 220px;
  background: transparent;
  border-right: 1px solid var(--border-1);
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-3);
  cursor: default;
}
.aip-tab:hover { color: var(--text-2); }
.aip-tab--active { background: var(--bg-0); color: var(--text-1); }
.aip-tab--active::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
}
.aip-tab__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aip-tab__close { width: 14px; height: 14px; display: inline-flex; align-items: center;
                   justify-content: center; color: var(--text-4); font-size: 11px; }
.aip-tab__close:hover { background: var(--bg-3); border-radius: 3px; color: var(--text-1); }
.aip-tabbar__new {
  width: 36px; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 16px; cursor: pointer;
}
.aip-tabbar__new:hover { background: var(--bg-3); color: var(--text-1); }
.aip-tabbar__spacer { flex: 1; }

/* Status dot — used in tabs, sidebar, etc. */
.aip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.aip-dot[data-status="running"]  { background: var(--st-running); }
.aip-dot[data-status="awaiting"] { background: var(--st-awaiting); box-shadow: 0 0 0 3px var(--st-awaiting-ring); }
.aip-dot[data-status="limited"]  { background: var(--st-limited); }
.aip-dot[data-status="idle"]     { background: var(--st-idle); }

/* ── Sidebar ─────────────────────────────────────────────────────── */
.aip-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-1);
  border-right: 1px solid var(--border-1);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.aip-sidebar__header {
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.aip-sidebar__header-title {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 1.2px; color: var(--text-3);
  text-transform: uppercase; font-weight: 600;
}
.aip-sidebar__header-actions { display: flex; gap: 4px; color: var(--text-4); }
.aip-sidebar__icon-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; font-size: 14px; cursor: pointer;
}
.aip-sidebar__icon-btn:hover { background: var(--bg-3); color: var(--text-1); }

.aip-overview {
  display: flex; align-items: stretch;
  border-bottom: 1px solid var(--border-1);
  background: var(--bg-1);
}
.aip-overview__cell {
  flex: 1; padding: 8px 10px;
  border-right: 1px solid var(--border-1);
  display: flex; flex-direction: column; gap: 4px;
  cursor: pointer;
}
.aip-overview__cell:last-child { border-right: none; }
.aip-overview__cell-top { display: flex; align-items: center; gap: 6px; }
.aip-overview__count {
  font-family: var(--font-mono); font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
}
.aip-overview__count--zero { color: var(--text-4); }
.aip-overview__label {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--text-4); letter-spacing: 0.4px; text-transform: uppercase;
}
.aip-overview__cell-dot { width: 5px; height: 5px; border-radius: 50%; }
.aip-overview__cell-dot--zero { opacity: 0.4; }

.aip-session-list { flex: 1; overflow: hidden; padding-top: 4px; }

.aip-session-row {
  position: relative;
  padding: 12px 14px 12px 16px;
  border-left: 2px solid transparent;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 6px;
}
.aip-session-row:hover { background: var(--bg-2); }
.aip-session-row--active {
  background: var(--bg-3);
  border-left-color: var(--accent);
}
.aip-session-row--active:hover { background: var(--bg-3); }

.aip-session-row__top { display: flex; align-items: center; gap: 10px; }
.aip-session-row__chip {
  width: 22px; height: 22px; border-radius: 5px;
  background: var(--bg-3); border: 1px solid var(--border-2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  color: var(--text-2); letter-spacing: 0.4px;
  position: relative; flex-shrink: 0;
}
.aip-session-row__chip-corner {
  position: absolute; top: -3px; right: -3px;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--bg-1);
}
.aip-session-row__chip-corner[data-status="running"]  { background: var(--st-running); }
.aip-session-row__chip-corner[data-status="awaiting"] { background: var(--st-awaiting); }
.aip-session-row__chip-corner[data-status="limited"]  { background: var(--st-limited); }

.aip-session-row__name {
  flex: 1; font-family: var(--font-mono); font-size: 12.5px;
  color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aip-session-row--active .aip-session-row__name { color: var(--text-1); }
.aip-session-row__cwd {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-4);
  margin-left: 32px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.aip-session-row__badge-row { margin-left: 32px; }

.aip-sidebar__footer {
  border-top: 1px solid var(--border-1);
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-4);
}
.aip-sidebar__footer-count { color: var(--text-3); }

/* ── Status badge ───────────────────────────────────────────────── */
.aip-badge {
  display: inline-flex; align-items: center;
  font-family: var(--font-mono);
}
.aip-badge--pill {
  gap: 6px; font-size: 10.5px; padding: 2px 8px;
  border-radius: 999px; letter-spacing: 0.2px; line-height: 1.4;
}
.aip-badge--pill[data-status="running"]  { color: var(--st-running);  background: var(--st-running-bg); }
.aip-badge--pill[data-status="awaiting"] { color: var(--st-awaiting); background: var(--st-awaiting-bg); }
.aip-badge--pill[data-status="limited"]  { color: var(--st-limited);  background: var(--st-limited-bg); }
.aip-badge--pill[data-status="idle"]     { color: var(--st-idle);     background: var(--st-idle-bg); }
.aip-badge--pill .aip-badge__dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.aip-badge__time { color: var(--text-3); margin-left: 2px; }

.aip-badge--dot { gap: 8px; font-size: 11px; color: var(--text-3); }
.aip-badge--dot .aip-badge__dot { width: 7px; height: 7px; border-radius: 50%; }
.aip-badge--dot[data-status="running"]  .aip-badge__dot { background: var(--st-running);  box-shadow: 0 0 0 3px var(--st-running-ring); }
.aip-badge--dot[data-status="awaiting"] .aip-badge__dot { background: var(--st-awaiting); box-shadow: 0 0 0 3px var(--st-awaiting-ring); }
.aip-badge--dot[data-status="limited"]  .aip-badge__dot { background: var(--st-limited);  box-shadow: 0 0 0 3px var(--st-limited-ring); }
.aip-badge--dot[data-status="idle"]     .aip-badge__dot { background: var(--st-idle);     box-shadow: 0 0 0 3px var(--st-idle-ring); }
.aip-badge--dot .aip-badge__time { color: var(--text-4); }

.aip-badge--icon { gap: 6px; font-size: 11px; }
.aip-badge--icon[data-status="running"]  { color: var(--st-running); }
.aip-badge--icon[data-status="awaiting"] { color: var(--st-awaiting); }
.aip-badge--icon[data-status="limited"]  { color: var(--st-limited); }
.aip-badge--icon[data-status="idle"]     { color: var(--st-idle); }
.aip-badge--icon .aip-badge__icon { font-size: 10px; }
.aip-badge--icon .aip-badge__label { color: var(--text-3); }

/* ── Terminal pane ──────────────────────────────────────────────── */
.aip-terminal {
  flex: 1; min-width: 0;
  background: var(--term-bg);
  position: relative;
  display: flex; flex-direction: column;
}
.aip-terminal__body { flex: 1; padding: 18px 22px 18px 18px; overflow: hidden; }
.aip-terminal__scroll {
  position: absolute; top: 8px; right: 4px; bottom: 8px; width: 6px;
}
.aip-terminal__scroll-thumb {
  position: absolute; top: 0; right: 0; width: 4px; height: 38%;
  background: var(--bg-4); border-radius: 2px;
}
.aip-line {
  font-family: var(--font-mono); font-size: 12.5px;
  line-height: 1.6;
  white-space: pre;
  color: var(--term-fg);
}
.aip-line--ai { border-left: 2px solid var(--term-magenta); padding-left: 12px; margin-left: -14px; }
.aip-line--blank { height: 1.6em; }
.aip-line--dim     { color: var(--term-dim); }
.aip-line--green   { color: var(--term-green); }
.aip-line--cyan    { color: var(--term-cyan); }
.aip-line--yellow  { color: var(--term-yellow); }
.aip-line--blue    { color: var(--term-blue); }
.aip-line--magenta { color: var(--term-magenta); }
.aip-line--red     { color: var(--term-red); }
.aip-line__prompt-host  { color: var(--term-blue); }
.aip-line__prompt-cmd   { color: var(--term-yellow); }
.aip-line__prompt-tail  { color: var(--term-fg); }
.aip-line__tool-meta    { color: var(--term-dim); margin-left: 16px; }

.aip-mdlink {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: var(--accent-soft);
  text-underline-offset: 3px;
  cursor: pointer;
}
.aip-mdlink:hover { text-decoration-color: var(--accent); }
.aip-mdlink--proposed { color: var(--text-3); text-decoration-color: var(--text-4); }

.aip-cursor-block {
  display: inline-block; width: 8px; height: 1em;
  background: var(--term-fg); vertical-align: middle; margin-left: 2px;
  animation: aip-blink 1.05s steps(1) infinite;
}

/* Per-pane label inside a split */
.aip-pane-label {
  position: absolute; top: 8px; left: 12px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-4); letter-spacing: 0.8px; text-transform: uppercase;
  background: var(--term-bg); padding: 2px 6px; border-radius: 3px;
  z-index: 2;
}
.aip-split-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.aip-split-divider { width: 1px; background: var(--border-2); }

/* ── Modal scrim ────────────────────────────────────────────────── */
.aip-scrim {
  position: absolute; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 120px; z-index: 10;
}

.aip-modal {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  overflow: hidden;
}
.aip-modal--settings { width: 560px; border-radius: 10px; }
.aip-modal--palette  { width: 620px; max-height: 520px; border-radius: 12px; display: flex; flex-direction: column;
                        box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05); }

.aip-modal__section { padding: 18px 22px; border-bottom: 1px solid var(--border-1); }
.aip-modal__header  {
  padding: 14px 22px; border-bottom: 1px solid var(--border-1);
  display: flex; align-items: center; justify-content: space-between;
}
.aip-modal__header-left { display: flex; align-items: center; gap: 10px; }
.aip-modal__crumb {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-4); text-transform: uppercase; letter-spacing: 1.4px;
}
.aip-modal__crumb-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-4); }
.aip-modal__title { font-size: 13px; color: var(--text-1); }
.aip-modal__close { width: 22px; height: 22px; display: inline-flex; align-items: center;
                    justify-content: center; color: var(--text-3); font-size: 14px; cursor: pointer; }
.aip-modal__close:hover { background: var(--bg-3); border-radius: 4px; color: var(--text-1); }
.aip-modal__footer {
  padding: 14px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}

.aip-label {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.aip-input {
  width: 100%; background: var(--bg-0);
  border: 1px solid var(--border-2); border-radius: 6px;
  padding: 9px 12px;
  font-family: var(--font-mono); font-size: 12.5px;
  color: var(--text-1);
}
.aip-input--focused {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.aip-chip {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-3); background: var(--bg-1);
  padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--border-1);
  cursor: pointer;
}
.aip-chip:hover { color: var(--text-1); border-color: var(--border-2); }

.aip-toggle { width: 36px; height: 20px; border-radius: 999px; position: relative; flex-shrink: 0; }
.aip-toggle--on { background: var(--accent); }
.aip-toggle--on .aip-toggle__knob { right: 2px; }
.aip-toggle__knob {
  position: absolute; top: 2px; right: 2px;

const STATUS_PRIORITY = {
  awaiting: 0,
  limited: 1,
  running: 2,
  idle: 3

function sortSessions(sessions) {
  return [...sessions].sort((a, b) => STATUS_PRIORITY[a.status] - STATUS_PRIORITY[b.status]);

/**
 * Update a session row in place — call this when status/time changes rather
 * than rebuilding the whole sidebar. Keeps the row's DOM identity so any
 * focus/hover state stays put.
 */
function updateSessionRow(row, session, opts = {}) {
  setClass(row, 'aip-session-row--active', !!opts.active);
  // Update corner dot
  const chip = row.querySelector('.aip-session-row__chip');
  let corner = row.querySelector('.aip-session-row__chip-corner');
  if (session.status === 'idle') {
    corner?.remove();
  } else {
    if (!corner) {
      corner = h('span', {
        class: 'aip-session-row__chip-corner'
      });
      chip?.appendChild(corner);
    }
    corner.setAttribute('data-status', session.status);
  }
  // Swap badge
  const badgeRow = row.querySelector('.aip-session-row__badge-row');
  if (badgeRow) {
    while (badgeRow.firstChild) badgeRow.removeChild(badgeRow.firstChild);
    badgeRow.appendChild(renderStatusBadge({
      status: session.status,
      time: session.time,
      style: opts.badgeStyle ?? 'pill'
    }));
  }
}

  }, children)]);
}
